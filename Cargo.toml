[package]
name = "oxenna"
version = "0.1.0"
authors = ["Nils Ritter <ritter.nils@protonmail.com>"]
edition = "2024"

[dependencies]
limine = "0.6.5"
uart_16550 = "0.6.0"
spin = "0.5.2"
x86_64 = "0.15.5"
pic8259 = "0.11.0"
pc-keyboard = "0.7.0"
oxenna-test-macro = { path = "test_macro" }

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[features]
default = []
test = []
