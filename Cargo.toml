[package]
name = "oxenna"
version = "0.1.0"
authors = ["Nils Ritter <ritter.nils@protonmail.com>"]
edition = "2024"

[dependencies]
limine = "0.6.5"
uart_16550 = "0.6.0"
spin = "0.5.2"
x86_64 = "0.15.5"
pic8259 = "0.11.0"
pc-keyboard = "0.7.0"
oxenna-test-macro = { path = "test_macro" }

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[features]
# Features are selected by Kconfig via `make menuconfig`.  Keep the
# dependency graph here as a second line of defence when the project is
# built directly with Cargo.
default = []
release_build = []
userspace = []
elf_et_dyn = []
elf_et_exec = []
shell = ["fs_ext2"]
test = ["fs_ext2"]
driver_qemu = []
driver_block = []
driver_ata = ["driver_block"]
fs_ext2 = ["driver_block", "driver_ata"]
