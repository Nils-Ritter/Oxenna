name: Oxenna CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils \
            e2fsprogs \
            git \
            qemu-system-x86 \
            qemu-utils \
            xorriso

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none
          components: rust-src, rustfmt

      - name: Validate configuration
        run: make olddefconfig

      - name: Build Oxenna
        run: make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oxenna-build
          path: |
            out/oxenna.iso
            disk.img
          if-no-files-found: error

  test:
    name: Kernel tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils \
            e2fsprogs \
            git \
            qemu-system-x86 \
            qemu-utils \
            xorriso

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none
          components: rust-src

      - name: Enable kernel tests
        run: |
          sed -i \
            's/^# CONFIG_BUILD_TESTS is not set$/CONFIG_BUILD_TESTS=y/' \
            .config

          sed -i \
            's/^# CONFIG_BUILD_TEST_ISO is not set$/CONFIG_BUILD_TEST_ISO=y/' \
            .config

          make olddefconfig

      - name: Run kernel tests
        run: make test-nogui
